{id:4,cat:'rs',type:'research',title:'Beyond Compliance: LCA of an Industrial MBBR Wastewater Treatment Plant',tools:['OpenLCA','Ecoinvent 3.10','ReCiPe 2016 (H)'],
short:b('Undergraduate thesis: Life Cycle Assessment of a full-scale MBBR plant, finding that upstream chemicals, not electricity, drive its footprint.','Skripsi: Life Cycle Assessment WWTP MBBR skala penuh, dengan temuan bahwa bahan kimia hulu, bukan listrik, yang mendominasi jejak lingkungannya.'),
bg:b('Conventional WWTP monitoring focuses on effluent quality and compliance, which misses burdens from chemical production and energy. Case study: a full-scale MBBR plant treating wastewater from a soap and cosmetics manufacturer in Indonesia, using 36 months of operational records (2023–2025).','Pemantauan WWTP konvensional berfokus pada kualitas efluen dan kepatuhan, sehingga beban dari produksi bahan kimia dan energi terlewat. Studi kasus: WWTP MBBR skala penuh yang mengolah limbah pabrik sabun dan kosmetik di Indonesia, memakai 36 bulan data operasional (2023–2025).'),
pr:b('A plant can meet its effluent limits and still carry a large indirect footprint. Where are the life-cycle hotspots, and which operational changes reduce them?','Sebuah instalasi bisa memenuhi baku mutu efluen tetapi tetap menanggung jejak tidak langsung yang besar. Di mana hotspot siklus hidupnya, dan perubahan operasional apa yang menguranginya?'),
ro:b('Carried out the full study as my undergraduate thesis (2026): inventory from operational records, OpenLCA model, hotspot analysis, uncertainty analysis and three improvement scenarios.','Menjalankan seluruh studi sebagai skripsi (2026): inventori dari catatan operasional, model OpenLCA, analisis hotspot, analisis ketidakpastian, dan tiga skenario perbaikan.'),

fl:{en:['36 months of data','Inventory','OpenLCA + ReCiPe','Hotspots','Monte Carlo','3 scenarios','Recommendations'],id:['Data 36 bulan','Inventori','OpenLCA + ReCiPe','Hotspot','Monte Carlo','3 skenario','Rekomendasi']},
re:{en:['Upstream chemical production is the dominant hotspot. PDMS-based antifoam contributes strongly across all five categories; PAC and other chemicals add to it.','Regulatory compliance does not mean a low footprint: impacts also come from chemical manufacturing, upstream energy, transport and sludge.','Modeled scenarios: PAC basicity optimization cuts NaOH demand by 40%; an alternative silicone antifoam cuts terrestrial ecotoxicity by about 53%; surfactant stream equalization gives the largest overall benefit (global warming −69%, fossil resource scarcity −60%).','Monte Carlo: relative half-width of the 95% CI was 1.42–1.77% in all five categories, under the 5% criterion.','All reductions are modeled. The 50% antifoam reduction in Scenario 3 is an assumption needing pilot validation, and no plant-level savings are claimed.'],id:['Produksi bahan kimia di hulu adalah hotspot dominan. Antifoam berbasis PDMS berkontribusi besar di kelima kategori; PAC dan bahan kimia lain menambahnya.','Kepatuhan regulasi tidak berarti jejak rendah: dampak juga berasal dari pembuatan bahan kimia, energi hulu, transportasi, dan lumpur.','Skenario termodel: optimasi basisitas PAC menurunkan kebutuhan NaOH 40%; antifoam silikon alternatif menurunkan ekotoksisitas terestrial sekitar 53%; equalisasi aliran surfaktan memberi manfaat total terbesar (pemanasan global −69%, kelangkaan sumber daya fosil −60%).','Monte Carlo: relative half-width CI 95% sebesar 1,42–1,77% di kelima kategori, di bawah kriteria 5%.','Semua penurunan bersifat hasil pemodelan. Pengurangan antifoam 50% pada Skenario 3 adalah asumsi yang perlu validasi pilot, dan tidak ada klaim penghematan di tingkat instalasi.']}},{id:5,cat:'ed',type:'research',title:'WWTP Design Using CMAS for City Domestic Wastewater',tools:['Excel','AutoCAD / QCAD','Google Earth'],

const DM=()=>`<p class="note">${t('dm')}</p>`,MON=['Jan','Feb','Mar','Apr','May','Jun'];
const SER={Waste:[[12.4,11.8,13.1,12,10.9,10.2],'t'],Energy:[[48,46,50,47,45,44],'MWh'],Water:[[1900,1850,1980,1820,1790,1760],'m³']};
const colH=k=>{const[v,u]=SER[k],m=Math.max(...v);return`<div class="col">${v.map((x,i)=>`<i style="height:${x/m*100}%" title="${MON[i]}: ${x} ${u}"></i>`).join('')}</div><div class="lab">${MON.map(x=>`<span>${x}</span>`).join('')}</div>`};
const bars=(a,u='%')=>a.map(([n,v,w])=>`<div class="bar"><span>${n}</span><div><i data-w="${w??v}"></i></div><b>${v}${u}</b></div>`).join('');
const pill=(c,x)=>`<span class="pill ${c}">${x}</span>`,flow=a=>`<div class="flow">${a.map(x=>`<span>${x}</span>`).join('<i>→</i>')}</div>`;
const AI={cat:{Plastic:[3.1,3,3.4,3,2.7,2.5],Carton:[4.2,4,4.5,4.1,3.7,3.4],Metal:[1.6,1.5,1.7,1.6,1.5,1.4],'Sludge (B3)':[3.5,3.3,3.5,3.3,3,2.9]},rec:[60,63,61,66,69,72]};
const aiH=m=>{const ks=Object.keys(AI.cat),tot=i=>ks.reduce((s,k)=>s+AI.cat[k][i],0),T0=tot(m),top=ks.reduce((a,k)=>AI.cat[k][m]>AI.cat[a][m]?k:a),mom=m?(T0-tot(m-1))/tot(m-1)*100:0,r=AI.rec[m];
const rt=m===0?'Moderate':(mom<=0&&r>=65)?'Good':mom<=5?'Moderate':'Critical',c={Good:'ok',Moderate:'warn',Critical:'bad'}[rt];
const rec={Good:b('Keep current segregation practice and share it with other areas.','Pertahankan praktik pemilahan saat ini dan bagikan ke area lain.'),Moderate:b('Review the top contributor and set a reduction target for next month.','Tinjau kontributor terbesar dan tetapkan target pengurangan bulan depan.'),Critical:b('Investigate the increase immediately and brief the waste team.','Selidiki kenaikan segera dan informasikan ke tim limbah.')}[rt];
